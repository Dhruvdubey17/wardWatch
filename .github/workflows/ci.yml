name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: cd python && uv sync --frozen
      - run: make lint-prose
      - run: cd python && uv run pytest -c pyproject.toml -q -m unit ../scripts/tests/unit

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: cd python && uv sync --frozen
      - run: cd python && uv run pytest -c pyproject.toml -q -m unit tests/unit

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang with the libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev ninja-build
      - uses: actions/cache@v4
        with:
          path: ingest/build/fuzz/_deps
          key: fuzz-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake', 'ingest/fuzz/CMakeLists.txt') }}
      - run: make fuzz FUZZ_SECONDS=60

  cpp-release:
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
    env:
      WARDWATCH_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build librdkafka-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: ingest/build/release/_deps
          key: cpp-release-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake') }}
      - run: cd ingest && cmake --preset release && cmake --build --preset release
      - run: cd ingest && ctest --preset release --label-exclude kafka
      - run: cd ingest && ctest --preset release --label-regex kafka

  cpp-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build librdkafka-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: ingest/build/asan/_deps
          key: cpp-asan-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake') }}
      - run: cd ingest && cmake --preset asan && cmake --build --preset asan && ctest --preset asan --label-exclude kafka

  cpp-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build librdkafka-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: ingest/build/tsan/_deps
          key: cpp-tsan-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake') }}
      - run: cd ingest && cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan --label-exclude kafka

  cpp-coverage:
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
    env:
      WARDWATCH_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm ninja-build librdkafka-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: ingest/build/coverage/_deps
          key: cpp-coverage-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake') }}
      - run: make ingest-coverage

  ingest-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ingest/Dockerfile
          tags: wardwatch-ingest:ci
          load: false
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,mode=max,scope=ingest

  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: cd python && uv sync --frozen
      - run: make python-lint

  python-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: cd python && uv sync --frozen
      - run: make python-test-unit

  python-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build librdkafka-dev pkg-config
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions/cache@v4
        with:
          path: ingest/build/debug/_deps
          key: cpp-debug-deps-${{ hashFiles('ingest/cmake/Dependencies.cmake') }}
      - run: cd python && uv sync --frozen
      - run: make python-test-integration
      - run: make python-coverage

  ml-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: cd python && uv sync --frozen
      - run: make ml-smoke

  python-images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [wardwatch-fhir, wardwatch-scorer, wardwatch-sim]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: python/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ matrix.service }}:ci
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: make frontend-lint PNPM="pnpm --dir frontend"

  frontend-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # The coverage run is the unit suite with the 80% line gate on top.
      - run: make frontend-coverage PNPM="pnpm --dir frontend"

  frontend-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: wardwatch-frontend:ci
          load: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  stack-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make smoke

  frontend-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The suite replays the simulator fixtures with `uv run`, which needs the workspace.
      - run: cd python && uv sync --frozen
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/playwright
      - run: make up
      - run: make frontend-test-e2e PNPM="pnpm --dir frontend"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: make down

  # The one check branch protection needs to require: it passes only when every job above passed.
  ci-passed:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - prose-lint
      - contracts
      - fuzz
      - cpp-release
      - cpp-asan
      - cpp-tsan
      - cpp-coverage
      - ingest-image
      - python-lint
      - python-unit
      - python-integration
      - ml-smoke
      - python-images
      - frontend-lint
      - frontend-unit
      - frontend-image
      - stack-smoke
      - frontend-e2e
    steps:
      - name: Every job passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "a required job did not pass" >&2
            exit 1
          fi
