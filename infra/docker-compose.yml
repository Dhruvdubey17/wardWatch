# The whole WardWatch stack. Run it through the Makefile:
#   make up      build and start everything except the simulator
#   make demo    make up, then start the simulator (the demo profile)
#   make down    stop and remove the stack and its volumes
# Every published port binds to 127.0.0.1. Inside the Compose network the
# services listen on all interfaces so they can reach each other.
name: wardwatch

x-python-service: &python-service
  build:
    context: ..
    dockerfile: python/Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wardwatch
      POSTGRES_PASSWORD: ${WARDWATCH_POSTGRES_PASSWORD:-wardwatch_dev}
      POSTGRES_DB: wardwatch
    # Not 5432 on the host, where a developer's own Postgres usually listens.
    ports: ["127.0.0.1:${WARDWATCH_POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "wardwatch", "--dbname", "wardwatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: wardwatch-kraft-cluster01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["127.0.0.1:9092:29092"]
    volumes: ["kafkadata:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the six topics once, then exits; everything that uses Kafka waits for it.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        for topic in hl7.validated hl7.deadletter fhir.observations ward.alerts ward.alert-events ward.scores; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1; done
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10
    restart: "no"

  ingest:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    command: ["--sink", "kafka", "--kafka-brokers", "kafka:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:2575:2575", "127.0.0.1:9464:9464"]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9464 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ok <&3
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fhir-service:
    <<: *python-service
    build:
      context: ..
      dockerfile: python/Dockerfile
      args: { SERVICE: wardwatch-fhir }
    command: ["wardwatch-fhir", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      WARDWATCH_FHIR_DATABASE_URL: postgresql+asyncpg://wardwatch:${WARDWATCH_POSTGRES_PASSWORD:-wardwatch_dev}@postgres:5432/wardwatch
      WARDWATCH_FHIR_KAFKA_BOOTSTRAP: kafka:9092
      WARDWATCH_FHIR_PUBLIC_BASE_URL: http://127.0.0.1:8000
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  scorer:
    <<: *python-service
    build:
      context: ..
      dockerfile: python/Dockerfile
      args: { SERVICE: wardwatch-scorer }
    command: ["wardwatch-scorer"]
    environment:
      WARDWATCH_SCORER_KAFKA_BOOTSTRAP: kafka:9092
      WARDWATCH_SCORER_FHIR_BASE_URL: http://fhir-service:8000
      # `make train` writes ml/artifacts/current; without it the scorer runs NEWS2 only.
      WARDWATCH_SCORER_BUNDLE_DIR: /opt/wardwatch/artifacts/current
      WARDWATCH_SCORER_METRICS_BIND: 0.0.0.0
    volumes: ["../ml/artifacts:/opt/wardwatch/artifacts:ro"]
    depends_on:
      fhir-service: { condition: service_healthy }
    ports: ["127.0.0.1:9465:9465"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9465/metrics', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  simulator:
    <<: *python-service
    build:
      context: ..
      dockerfile: python/Dockerfile
      args: { SERVICE: wardwatch-sim }
    profiles: [demo]
    entrypoint: ["/bin/sh", "/opt/wardwatch/replay.sh"]
    environment:
      WARDWATCH_SIM_HOST: ingest
      WARDWATCH_SIM_PORT: "2575"
    volumes:
      - ./simulator/replay.sh:/opt/wardwatch/replay.sh:ro
      - ../data:/data:ro
      - ../python/simulator/tests/fixtures:/fixtures:ro
    depends_on:
      ingest: { condition: service_healthy }
      scorer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('ingest', 2575), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      args: { WARDWATCH_API_URL: "http://fhir-service:8000" }
    depends_on:
      fhir-service: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: wardwatch
      GF_SECURITY_ADMIN_PASSWORD: ${WARDWATCH_GRAFANA_PASSWORD:-wardwatch_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    ports: ["127.0.0.1:3001:3000"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
