[project]
name = "wardwatch-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["wardwatch-sim", "wardwatch-ml", "wardwatch-fhir", "wardwatch-scorer"]

[dependency-groups]
dev = [
    "hl7>=0.4.5",
    "hypothesis>=6.100",
    "jsonschema[format]>=4.22",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pre-commit>=3.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema>=4.22",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["simulator", "ml", "fhir_service", "scorer"]

[tool.uv.sources]
wardwatch-sim = { workspace = true }
wardwatch-ml = { workspace = true }
wardwatch-fhir = { workspace = true }
wardwatch-scorer = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/tests/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "BLE", "TRY", "C4", "PL"]
ignore = [
    # Magic value comparisons are the norm in clinical score tables and tests.
    "PLR2004",
    # Scoring and feature functions take many domain parameters by design.
    "PLR0913",
    # TRY003 would force a custom exception class for every error message.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
mypy_path = "."

# The hl7 package ships no type information and has no stub package. It is used
# only in tests as an independent parser.
[[tool.mypy.overrides]]
module = ["hl7", "hl7.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [".", "../scripts"]
addopts = "-p layer_markers --strict-markers -ra"
markers = [
    "unit: in-process test with no network, no Docker and no real clock",
    "integration: test that crosses a real boundary (socket, subprocess, Postgres, Kafka, HTTP)",
]
filterwarnings = ["error"]
