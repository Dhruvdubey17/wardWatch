[project]
name = "wardwatch-scorer"
version = "0.1.0"
description = "Hourly NEWS2 and sepsis risk scorer for WardWatch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.11",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.4",
    "wardwatch-ml[model]",
]

[project.scripts]
wardwatch-scorer = "wardwatch_scorer.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardwatch_scorer"]

[tool.uv.sources]
wardwatch-ml = { workspace = true }
