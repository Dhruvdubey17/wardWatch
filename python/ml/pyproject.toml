[project]
name = "wardwatch-ml"
version = "0.1.0"
description = "Data loading, features, NEWS2, models and evaluation for WardWatch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "torch>=2.4",
    "shap>=0.46",
    "matplotlib>=3.9",
]

[project.scripts]
wardwatch-ml = "wardwatch_ml.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardwatch_ml"]
