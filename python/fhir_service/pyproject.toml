[project]
name = "wardwatch-fhir"
version = "0.1.0"
description = "HL7 to FHIR conversion service and ward API for WardWatch."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.11",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn>=0.30",
    "wardwatch-ml",
]

[project.scripts]
wardwatch-fhir = "wardwatch_fhir.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardwatch_fhir"]

[tool.uv.sources]
wardwatch-ml = { workspace = true }
